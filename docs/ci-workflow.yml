# CI workflow for readme-gen. Copy to .github/workflows/ci.yml to enable it
# (pushing files under .github/workflows requires a token with the `workflow` scope).
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: node bin/readme-gen.js --help
