# Attaches an installable npm tarball to each published GitHub release.
# Uses only the built-in GITHUB_TOKEN; npm publishing is intentionally not automated yet.
name: Release assets

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  tarball:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # upload release assets
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm pack
      - name: Upload tarball to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$TAG" readme-gen-*.tgz --clobber --repo "$GITHUB_REPOSITORY"
